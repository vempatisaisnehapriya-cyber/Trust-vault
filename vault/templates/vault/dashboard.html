<!DOCTYPE html>
<html>
<head>
    <title>TrustVault Dashboard</title>
</head>
<body style="background:#101827; color:white; text-align:center; font-family:Arial; padding-top:100px;">

    <h1 style="color:#38d9c5;">Welcome to TrustVault!</h1>
    <h2>Your Personal Dashboard</h2>
    <h3>Upload Your Document</h3>

<form method="POST" action="/upload/" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="text" name="title" placeholder="Document Name" required>
    <br><br>

    <input type="file" name="file" required>
    <br><br>

    <button type="submit">Upload Document</button>
</form>
<form method="GET" action="/dashboard/">
    <input type="text" name="search" placeholder="Search documents...">
    <button type="submit">Search</button>
</form>
    <h3>Your Documents</h3>

{% for document in documents %}
    <p>
        {{ document.title }}
        <a href="{{ document.file.url }}" download>Download</a>
        <form method="POST" action="{% url 'delete_document' document.id %}">
    {% csrf_token %}
    <button type="submit">Delete</button>
</form>
    </p>
{% empty %}
    <p>No documents uploaded yet.</p>
{% endfor %}   
    <p>Your account is successfully logged in.</p>
    <a href="/logout/">
    <button>Logout</button>
    </a>
</body>
</html>
